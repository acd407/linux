%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/hisilicon,histb-volt.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiSilicon STB PWM controlled voltage regulator

maintainers:
  - David Yang <mmyangfl@gmail.com>

description: |
  HiSilicon STB SoCs provide PWM outputs in the PMOC block which drive an
  external converter. The output voltage is set by the duty cycle of the PWM
  signal: the register holds duty cycle + 1 in bits 31:16 and period + 1 in
  bits 15:0, both counted in oscillator periods, and a larger duty cycle
  results in a lower output voltage.

properties:
  compatible:
    const: hisilicon,histb-volt

  reg:
    maxItems: 1

required:
  - compatible
  - reg
  - regulator-min-microvolt
  - regulator-max-microvolt

allOf:
  - $ref: regulator.yaml#

unevaluatedProperties: false

examples:
  - |
    vddcpu: regulator@8a23018 {
        compatible = "hisilicon,histb-volt";
        reg = <0x8a23018 0x4>;
        regulator-name = "vdd-cpu";
        regulator-min-microvolt = <700000>;
        regulator-max-microvolt = <1250000>;
        regulator-always-on;
    };
